# Nginx do frontend em produção.
# - SPA: qualquer rota que não bata em arquivo devolve /index.html.
# - Proxy do /api/* para o container do backend (serviço "backend" no
#   docker-compose) — mesma origem, sem CORS pra resolver no navegador.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/manifest+json;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Padrão do nginx é 1MB — pequeno demais pra foto de câmera de
        # celular (upload de foto da execução, app de campo).
        client_max_body_size 20m;
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
