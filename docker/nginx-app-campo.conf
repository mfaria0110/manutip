# Nginx do app de campo (PWA) em produção, servido sob /campo/ no mesmo
# domínio do site de escritório. O nginx do SISTEMA (fora do Docker) repassa
# location /campo/ pra este container preservando o prefixo na URI — por
# isso usamos `alias` em vez de `root`, pra tirar o /campo/ do caminho de
# arquivo (o build do Vite está em / dentro da imagem, não em /campo/).
#
# Chamadas a /api/* feitas pelo app (fetch("/api/...")) são absolutas a
# partir da raiz do domínio, então nem passam por este container — o nginx
# do sistema já manda pro container do site de escritório, que repassa pro
# backend (mesmo backend dos dois apps).

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/manifest+json;

    location = /campo {
        return 301 /campo/;
    }

    location /campo/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /campo/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /campo/index.html;
    }
}
